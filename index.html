:root{
 --bg:#f3f6f5;--panel:#ffffff;--ink:#15211f;--muted:#788581;

 --shadow:0 9px 26px rgba(24,60,47,.045);--shadow-lg:0 24px 60px rgba(12,30,28,.14);
}
@media(prefers-color-scheme:dark){
 :root{
  color-scheme:dark;--bg:#0d1216;--panel:#171e22;--ink:#f0f5f1;
  --muted:#9baaa8;--line:#29343a;--green:#7bd8b3;--green-light:#1d3931;
  --blue:#8cbcdf;--soft:#11191e;--glass:rgba(24,31,35,.94);
  --hero-grad:radial-gradient(110% 145% at 97% 2%,rgba(58,137,120,.42),transparent 63%),linear-gradient(130deg,#173830,#102123 82%);
  --shadow:0 10px 26px rgba(0,0,0,.11);--shadow-lg:0 28px 80px rgba(0,0,0,.42);
 }
}

.empty{font-size:13px;line-height:1.65;padding:29px 20px}
.cards2{gap:10px;margin-bottom:16px}
.smallcard{padding:16px;border-radius:19px;min-height:88px}

.note{background:var(--soft);color:var(--muted);border:1px solid var(--line);padding:13px 15px;border-radius:16px;font-size:12px;line-height:1.6}

.pill{background:var(--green-light);color:var(--green);font-weight:720;border-radius:100px}
.search{margin:13px 0 11px;width:100%;border-radius:16px;padding:14px 16px;background:var(--panel);font-size:14px;outline:0;box-shadow:var(--shadow)}

.chiprow{gap:7px;padding:1px 0 12px}
.chip{background:transparent;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:12px;font-weight:650}
.chip.on{background:var(--green-light);color:var(--green);border-color:transparent}
.button{min-height:47px;padding:13px 16px;border-radius:15px;background:var(--ink);font-size:13px;font-weight:760;letter-spacing:-.05px}

.select{min-width:128px;max-width:100%;padding:11px 9px}

function placeAnalytics(){
 const all=(state.report.places||[]).filter(x=>x.currency==='RUB');

async function openTextBatch(id,expanded=-1){
 try{
  const response=await api('text-batch?id='+encodeURIComponent(id));
  const batch=response.batch,p=batch.payload||{},items=Array.isArray(p.items)?p.items:[];
  if(batch.status!=='ready'){toast('Список уже обработан');return}
  state.selected={type:'text-batch',id};
  const groups=new Map(),separate=[];
  items.forEach((item,index)=>{
    if(batchMode(item)!=='expense'){separate.push({item,index});return}
    const cat=item.category||'other';
    if(!groups.has(cat))groups.set(cat,[]);
    groups.get(cat).push({item,index});
  });
  const purchases=items.filter(x=>batchMode(x)==='expense'),transfers=items.filter(x=>['external','own'].includes(batchMode(x)));
  const total=purchases.reduce((n,x)=>n+Number(x.amount_minor||0),0);
  let html='<div class="between"><div><div class="kicker">Список покупок · '+esc(p.date||'')+'</div>'+
    '<h2 style="margin:5px 0">Проверка расходов</h2></div><button class="iconbtn" onclick="closeModal()">'+ico('close')+'</button></div>'+
    '<div class="surface smallcard" style="margin:14px 0"><div class="kicker">К сохранению</div>'+
    '<div class="number" style="font-size:25px;margin:4px 0">'+fmt(total)+'</div>'+
    '<div class="sub">'+purchases.length+' '+ruPlural(purchases.length,'покупка','покупки','покупок')+' · '+transfers.length+' '+ruPlural(transfers.length,'перевод','перевода','переводов')+' · '+(items.length-purchases.length-transfers.length)+' исключено</div></div>'+
    '<div class="note">Бот предложил категории автоматически. Нажми на товар, только если хочешь что-то исправить.</div>'+  '<span class="sub" style="display:block;margin-top:9px">Создать свой пункт можно кнопкой ＋ рядом с нужным полем.</span>';
  for(const [category,entries] of groups)html+=batchEditorGroup(id,category,entries,expanded);
  if(separate.length)html+=batchEditorGroup(id,'__separate__',separate,expanded);
  html+='<div style="display:grid;gap:10px;margin-top:20px">'+
    '<button class="button positive full" onclick="confirmTextBatch(\''+id+'\')" '+(purchases.length+transfers.length?'':'disabled')+'>Подтвердить операции</button>'+
    '<button class="button secondary full" onclick="cancelTextBatch(\''+id+'\')">Отменить список</button></div>';
  sheet(html);
 }catch(e){toast(e.message)}
}
async function changeBatchField(id,index,field,value){
 if(value==='__new__'&&(field==='category'||field==='place')){
   newCatalog(field,{source:'batch',kind:field,id,index});return;
 }
 try{
  const v=await api('batch-edit',{id,index,field,value});
  if(v.status!=='ok')throw Error('Не удалось изменить: '+String(v.status));
  await openTextBatch(id,index);toast('Изменение сохранено');
 }catch(e){toast(e.message)}
}
async function saveBatchDetails(id,index){
 const title=el('bt-title-'+index)?.value?.trim()||'';
 const value=el('bt-amount-'+index)?.value?.trim().replace(/\s/g,'').replace(',','.');
 const amount=Number(value),amount_minor=Math.round(amount*100);
 if(!title||title.length<2||title.length>160||!Number.isFinite(amount)||amount<=0||
    !Number.isSafeInteger(amount_minor)||Math.abs(amount_minor/100-amount)>.005){
  toast('Проверь название и сумму');return;
 }
 try{
  const v=await api('batch-edit',{id,index,field:'details',title,amount_minor});
  if(v.status!=='ok')throw Error('Не удалось сохранить');
  await openTextBatch(id,index);toast('Позиция исправлена');
 }catch(e){toast(e.message)}
}
async function confirmTextBatch(id){

  closeModal();state.tab='history';await load();

async function cancelTextBatch(id){

 }catch(e){toast(e.message)}
}

async function saveInlinePlaceType(){
 const name=el('ct-kind-name')?.value?.trim()||'';
 const group=el('ct-kind-group')?.value||'offline';
 if(name.length<2||name.length>60){toast('Укажи название типа от 2 до 60 символов');return}
 const saveBtn=el('ct-kind-inline')?.querySelector('button.button.positive');
 if(saveBtn)saveBtn.disabled=true;
 try{
  const result=await api('place-type-create',{name,group_kind:group});
  if(result.status!=='ok'||!result.record?.id)throw Error('Тип места не создан');
  state.placeTypes.push(result.record);
  const select=el('ct-kind'),id=result.record.id;
  if(select){
   const option=document.createElement('option');option.value=id;option.textContent=result.record.name;
   select.add(option,select.querySelector('option[value="__new__"]'));
   select.value=id;
  }
  hideInlinePlaceType();
  toast('Тип «'+result.record.name+'» сохранён и выбран');
 }catch(e){toast(e.message)}
 finally{if(saveBtn)saveBtn.disabled=false}
}

async function reopenPurchaseContext(ctx){
 if(ctx.source==='manual')return openAdd(state.manualValues||{});
 if(ctx.source==='batch')return openTextBatch(ctx.id,ctx.index);
 if(ctx.source==='draft')return openDraft(ctx.id);
 if(ctx.source==='saved')return tx(ctx.kind==='category'?ctx.parent:ctx.id);
 return openCatalog();
}
async function saveCatalog(kind){
 if(kind==='place'&&el('ct-kind-inline')?.style.display==='block'){
  toast('Сначала сохрани новый тип места или нажми «Отмена»');return;
 }
 const name=el('ct-name')?.value.trim(),phrase=el('ct-phrase')?.value.trim();
 if(!name||name.length<2){toast('Укажи название');return}
 const context=state.catalogContext;
 try{
  const created=await api('catalog-create',{kind,name,place_kind:el('ct-kind')?.value||'offline'});
  if(created.status!=='ok'||!created.record?.id)throw Error('Создать не удалось');
  let ruleWarning='';
  if(phrase){
   try{await api('rule-create',{target_type:kind,target_id:created.record.id,phrase,
    match_field:el('ct-field')?.value,match_type:el('ct-match')?.value})}
   catch(e){ruleWarning=e.message}
  }
  let applyWarning='';
  if(context&&context.source!=='manual'){
   try{
    let applied;
    if(context.source==='batch'){
     applied=await api('batch-edit',{id:context.id,index:context.index,
      field:kind==='category'?'category':'place',value:created.record.id});
    }else if(kind==='category'){
     applied=await api('category',{kind:context.source,id:context.id,
      index:context.index,category:created.record.id});
    }else{
     applied=await api('place',{kind:context.source,id:context.id,
      place:created.record.id});
    }
    if(applied.status!=='ok')throw Error('Не удалось присвоить новой записи');
   }catch(e){applyWarning=e.message}
  }
  await refreshSilent();
  state.catalogContext=null;
  if(context&&!applyWarning){
   if(context.source==='manual'){
    state.manualValues={...state.manualValues,[kind==='category'?'category':'place']:created.record.id};
   }
   await reopenPurchaseContext(context);
  }else openCatalog();
  if(applyWarning)toast('Категория создана, но покупку не удалось изменить: '+applyWarning);

  else toast(context?'Создано и выбрано для покупки':'Добавлено'+(phrase?' с правилом':''));
 }catch(e){toast(e.message)}
}

function ledgerMonthLabel(month){
 return new Date(month+'-01T12:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
}
async function openCategoryLedger(categoryId,placeId=null){
 const month=state.month,categoryName=categoryLabel(categoryId);
 const context={categoryId,placeId:placeId||null,month};
 state.categoryLedgerContext=context;
 sheet('<div class="between"><div><div class="kicker">Выписка · '+esc(ledgerMonthLabel(month))+'</div>'+
  '<h2 style="margin:5px 0">'+esc(categoryName)+'</h2></div>'+
  '<button class="iconbtn" onclick="closeModal()" aria-label="Закрыть">'+ico('close')+'</button></div>'+
  '<div class="surface empty" style="margin-top:15px">Загружаю покупки…</div>');
 try{
   const query=new URLSearchParams({month,category:categoryId});
   if(placeId)query.set('place',placeId);
   const details=await api('category-ledger?'+query.toString());
   if(state.categoryLedgerContext!==context)return;
   const items=Array.isArray(details.items)?details.items:[];
   const groups=new Map();
   for(const item of items){
     const day=item.occurred_on||'';
     if(!groups.has(day))groups.set(day,[]);
     groups.get(day).push(item);
   }
   const placeName=placeId?placeLabel(placeId):'Все места покупок';
   let html='<div class="between"><div><div class="kicker">Выписка · '+esc(ledgerMonthLabel(month))+'</div>'+
      '<h2 style="margin:5px 0">'+esc(categoryName)+'</h2></div>'+
      '<button class="iconbtn" onclick="closeModal()" aria-label="Закрыть">'+ico('close')+'</button></div>'+
      '<div class="surface smallcard" style="margin:17px 0 14px">'+
       '<div class="kicker">Всего по категории</div>'+
       '<div class="number" style="font-size:26px;margin-top:5px">'+fmt(details.total_minor,details.currency||'RUB')+'</div>'+
       '<div class="sub" style="margin-top:7px">'+
          Number(details.purchase_count||0)+' '+ruPlural(details.purchase_count,'покупка','покупки','покупок')+' · '+Number(details.item_count||0)+' '+ruPlural(details.item_count,'позиция','позиции','позиций')+'</div>'+
       '<div class="sub" style="margin-top:3px">📍 '+esc(placeName)+'</div></div>';
   if(!items.length){
     html+='<div class="surface empty">За выбранный месяц в этой категории нет покупок.</div>';
   }else{
     for(const [day,records] of groups){
       html+='<div class="footerhint" style="margin:18px 0 6px">'+esc(shortDate(day))+'</div>'+
        '<div class="surface" style="padding:0 14px">'+records.map(item=>{
         const txId=item.transaction_id;
         const merchant=item.merchant||'Без магазина';
         const label=item.item_title||merchant||'Покупка';
         const location=placeLabel(item.place_id||'unknown');
         const detail=merchant.toLocaleLowerCase('ru-RU')===label.toLocaleLowerCase('ru-RU')?location:merchant+' · '+location;
         return '<button type="button" class="ledger-item" data-tx="'+esc(txId)+
           '" onclick="openCategoryTransaction(this.dataset.tx)">'+
           '<div class="avatar">'+shopIcon(merchant)+'</div>'+
           '<div class="grow"><div class="itemname">'+esc(label)+'</div>'+
           '<div class="line2">'+esc(detail)+'</div></div>'+
           '<div class="itemprice">'+fmt(item.item_amount_minor,item.currency||'RUB')+'</div>'+
           '<span class="cat-chevron" aria-hidden="true">›</span></button>';
         }).join('')+'</div>';
     }
   }
   html+='<div class="footerhint" style="margin-top:16px">Показаны суммы позиций выбранной категории, а не общий итог каждого чека. Если чек содержит товары нескольких категорий, остальные товары сюда не включаются. Нажми покупку, чтобы открыть полный чек.</div>';
   sheet(html);
 }catch(e){
   if(state.categoryLedgerContext!==context)return;
   sheet('<div class="between"><h2>'+esc(categoryName)+'</h2>'+
     '<button class="iconbtn" onclick="closeModal()">'+ico('close')+'</button></div>'+
     '<div class="note warn" style="margin:15px 0">'+esc(e.message)+'</div>'+
     '<button class="button secondary full" data-cat="'+esc(categoryId)+
      '" data-place="'+esc(placeId||'')+'" onclick="openCategoryLedger(this.dataset.cat,this.dataset.place||null)">Повторить</button>');
 }
}
function openCategoryTransaction(id){
 return tx(id,state.categoryLedgerContext||null);
}

async function tx(id,returnContext=null){try{const v=await api('transaction?id='+encodeURIComponent(id));let t=v.transaction,items=v.items||[];state.selected={type:'tx',id,returnContext};sheet(`${returnContext?'<button type="button" class="txtlink" style="margin:0 0 12px" data-cat="'+esc(returnContext.categoryId)+'" data-place="'+esc(returnContext.placeId||'')+'" onclick="openCategoryLedger(this.dataset.cat,this.dataset.place||null)">← К выписке категории</button>':''}<div class="between"><div><div class="kicker">${esc(t.occurred_on)}</div><h2 style="margin:5px 0">${esc(t.merchant||'Покупка')}</h2></div><button class="iconbtn" onclick="closeModal()">${ico('close')}</button></div><h1 style="margin:17px 0 2px">${fmt(t.amount_minor,t.currency)}</h1><div class="sub">${t.gross_amount_minor&&t.gross_amount_minor!==t.amount_minor?'Полный счёт '+fmt(t.gross_amount_minor,t.currency):'Личные расходы'}</div><div class="sectiontitle"><h2>Где куплено</h2></div>${selectPlace(t.place_id||'unknown',id,'saved')}<div class="sectiontitle"><h2>Позиции · ${items.length}</h2></div>${items.map((x,i)=>`<div class="itemedit"><div class="grow"><div class="itemeditname">${esc(x.title)}</div><div class="itemeditsum">${fmt(x.amount_minor,t.currency)}</div></div>${selectCategory(x.category_id,x.id,'saved',i,id)}</div>`).join('')||'<div class="empty">Нет товарных позиций</div>'}<div class="buttonrow" style="margin-top:24px"><button class="button secondary" onclick="closeModal()">Закрыть</button><button class="button danger" onclick="deleteTx('${id}')">Удалить</button></div>`)}catch(e){toast(e.message)}}
async function openDraft(id){try{const v=await api('draft?id='+encodeURIComponent(id));let d=v.draft,p=d.payload||{},items=p.items||[];state.selected={type:'draft',id};const total=items.reduce((s,x)=>s+(Number(x.amount_minor)||0),0),mine=items.reduce((s,x)=>s+(Number(x.my_minor??x.amount_minor)||0),0);const payment=p.source==='marketplace_order'&&p.payment_status!=='paid';
const splitSummary=mine!==Number(p.total_minor);
const draftSummary='<div class="surface insight-total" style="margin:16px 0">'+
 '<div><div class="kicker">'+(splitSummary?'Моя доля':'К учёту')+'</div>'+
 (splitSummary?'<div class="sub" style="margin-top:7px">Весь счёт '+fmt(p.total_minor,p.currency)+'</div>':'')+
 '</div><strong>'+fmt(mine,p.currency)+'</strong></div>';
sheet(`<div class="between"><div><div class="kicker">Черновик · ${esc(p.date)}</div><h2 style="margin:5px 0">${esc(p.merchant||'Документ')}</h2></div><button class="iconbtn" onclick="closeModal()">${ico('close')}</button></div>${draftSummary}${total!==Number(p.total_minor)?'<div class="note warn">Суммы товаров не сходятся с итогом — подтверждение недоступно. Нужно исправить распознавание.</div>':''}${payment?'<div class="note warn" style="margin-bottom:12px">Оплата заказа ещё не подтверждена.</div><button class="button secondary full" onclick="markPaid(\''+id+'\')">Я проверил: заказ оплачен</button>':''}<div class="sectiontitle"><h2>Где куплено</h2></div>${selectPlace(p.place_id||'unknown',id,'draft')}<div class="sectiontitle"><h2>Товарные позиции · ${items.length}</h2></div>${items.map((x,i)=>`<div class="itemedit"><div class="grow"><div class="itemeditname">${esc(x.name)}</div><div class="itemeditsum">${fmt(x.amount_minor,p.currency)}${Number(x.my_minor??x.amount_minor)!==Number(x.amount_minor)?' · моё '+fmt(x.my_minor??x.amount_minor,p.currency):''}</div><div style="margin-top:7px"><select class="select" onchange="updateShare('${id}',${i},this.value)">${Object.entries(shareNames).map(([k,n])=>`<option value="${k}" ${(x.split_mode||'mine')===k?'selected':''}>${n}</option>`).join('')}</select></div></div>${selectCategory(x.category,id,'draft',i)}</div>`).join('')||'<div class="empty">Нет товаров</div>'}${(p.warnings||[]).length?`<div class="note warn" style="margin:13px 0">${p.warnings.map(esc).join('<br>')}</div>`:''}<div class="buttonrow" style="margin-top:24px"><button class="button secondary" onclick="cancelDraft('${id}')">Отменить</button><button class="button positive" ${total!==Number(p.total_minor)||!mine||payment?'disabled':''} onclick="confirmDraft('${id}')">Подтвердить</button></div><div class="footerhint">Категории и доли сохраняются сразу; окончательно расход учитывается после подтверждения.</div>`)}catch(e){toast(e.message)}}
async function updatePlace(kind,id,place){
 try{
  const result=await api('place',{kind,id,place});
  if(result.status!=='ok')throw Error('Место покупки не изменено');
  toast('Место покупки обновлено');
  if(kind==='draft')await openDraft(id);else await tx(id,state.selected?.type==='tx'?state.selected.returnContext:null);
  await refreshSilent();
 }catch(e){toast(e.message)}
}
async function updateCategory(kind,id,idx,category){try{await api('category',{kind,id,index:idx,category});toast('Категория обновлена');if(kind==='draft')await openDraft(id);else if(state.selected?.type==='tx')await tx(state.selected.id,state.selected.returnContext);await refreshSilent()}catch(e){toast(e.message)}}
async function updateShare(id,index,mode){try{await api('share',{id,index,mode});toast('Доля изменена');await openDraft(id)}catch(e){toast(e.message)}}
async function markPaid(id){if(!confirm('Подтверждаешь, что заказ действительно оплачен?'))return;try{const result=await api('paid',{id});if(result.status!=='ok')throw Error('Статус оплаты не изменён');await openDraft(id)}catch(e){toast(e.message)}}
async function confirmDraft(id){try{const result=await api('confirm',{id});if(result.status!=='ok'&&result.status!=='duplicate')throw Error('Документ не подтверждён: '+String(result.status));closeModal();state.tab='history';await load();toast('Покупка сохранена')}catch(e){toast(e.message)}}

async function deleteTx(id){if(!confirm('Удалить эту покупку из истории и аналитики?'))return;try{let x=await api('delete-start',{action:'one',id});let y=await api('delete-confirm',{intentId:x.id});if(y.status!=='ok')throw Error('Не удалось удалить запись');closeModal();await load();toast('Покупка удалена')}catch(e){toast(e.message)}}
async function clearHistory(){if(!confirm('Очистить всю историю расходов? Все ранее сохранённые покупки будут скрыты из статистики.'))return;if(prompt('Для подтверждения введи ОЧИСТИТЬ')!=='ОЧИСТИТЬ')return;try{const x=await api('delete-start',{action:'all'}),y=await api('delete-confirm',{intentId:x.id});if(y.status!=='ok')throw Error('Очистка не выполнена');await load();toast('История очищена')}catch(e){toast(e.message)}}

function suggestManual(){
 const desc=String(el('newdesc')?.value||'').normalize('NFKC').toLocaleLowerCase('ru-RU').replace(/\s+/g,' ').trim();
 if(!desc)return;
 const sorted=[...(state.rules||[])].filter(x=>x.enabled).sort((a,b)=>
  (b.match_type==='exact'?1:0)-(a.match_type==='exact'?1:0)||b.phrase.length-a.phrase.length);
 for(const type of ['category','place']){
  const select=el(type==='category'?'newcat':'newplace');
  if(!select||select.dataset.touched==='1')continue;
  const matched=sorted.find(rule=>{
   if(rule.target_type!==type)return false;
   const phrase=String(rule.phrase).normalize('NFKC').toLocaleLowerCase('ru-RU').replace(/\s+/g,' ').trim();
   return phrase&&(rule.match_type==='exact'?desc===phrase:desc.includes(phrase));
  });
  if(matched)select.value=matched.target_id;
 }
}

function manualCreate(kind){
 state.manualValues={amount:el('newamount')?.value||'',desc:el('newdesc')?.value||'',
  category:el('newcat')?.value||'',place:el('newplace')?.value||'auto'};
 newCatalog(kind,{source:'manual',kind});
}
function openAdd(values={}){sheet(`<div class="between"><h2>Новый расход</h2><button class="iconbtn" onclick="closeModal()">${ico('close')}</button></div><div style="margin-top:22px"><label class="formlabel">Сумма в рублях</label><input class="input" id="newamount" inputmode="decimal" placeholder="Например, 350,50" value="${esc(values.amount||'')}"/><label class="formlabel">Описание</label><input class="input" id="newdesc" oninput="suggestManual()" placeholder="Кофе, такси, продукты..." value="${esc(values.desc||'')}"/><label class="formlabel">Категория</label><div class="select-with-add"><select class="input" id="newcat" onchange="if(this.value==='__new__')manualCreate('category');else this.dataset.touched='1'">${categoryOptions().map(c=>`<option value="${esc(c.id)}" ${c.id===values.category?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="__new__">＋ Создать категорию…</option></select><button class="inline-add" type="button" aria-label="Создать категорию" onclick="manualCreate('category')">＋</button></div><label class="formlabel">Где куплено</label><div class="select-with-add"><select class="input" id="newplace" onchange="if(this.value==='__new__')manualCreate('place');else this.dataset.touched='1'"><option value="auto" ${!values.place||values.place==='auto'?'selected':''}>Определить автоматически</option>${(state.places||[]).map(p=>`<option value="${esc(p.id)}" ${p.id===values.place?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="__new__">＋ Создать место…</option></select><button class="inline-add" type="button" aria-label="Создать место покупки" onclick="manualCreate('place')">＋</button></div><button class="button positive full" onclick="saveManual()">Сохранить расход</button><div class="footerhint">Если задано правило для описания, категория и магазин подставятся автоматически. Фото чека отправляй в чат с ботом.</div></div>`)}
async function saveManual(){let amount=el('newamount')?.value.replace(',','.'),desc=el('newdesc')?.value.trim(),category=el('newcat')?.value;if(!Number.isFinite(+amount)||+amount<=0||!desc){toast('Укажи корректную сумму и описание');return}try{await api('manual',{amount:+amount,description:desc,category,place:el('newplace')?.value||'auto'});closeModal();state.tab='history';await load();toast('Расход добавлен')}catch(e){toast(e.message)}}
async function refreshSilent(){let d=await api('state?month='+encodeURIComponent(state.month));state.rows=d.transactions||[];state.drafts=d.drafts||[];state.textBatches=d.batches||[];state.places=d.places||[];state.placeTypes=d.placeTypes||[];state.categories=d.categories||[];state.rules=d.rules||[];state.transfers=d.transfers||[];state.report=d.report||{currencies:[],categories:[],merchants:[]};render()}
load();
