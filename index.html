<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="robots" content="noindex,nofollow"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/><meta name="theme-color" content="#f7f8fa"/><title>Мои финансы</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#f7f8fa;--panel:#fff;--ink:#151a22;--muted:#828999;--line:#ebedf1;--green:#137b5c;--green-light:#e8f5ef;--blue:#4876d8;--shadow:0 10px 30px rgba(25,35,58,.035)}
@media(prefers-color-scheme:dark){:root{--bg:#111319;--panel:#1b1e26;--ink:#f4f5f8;--muted:#9ca4b3;--line:#30343e;--green:#51c69d;--green-light:#203d32;--blue:#83a5ff;--shadow:none}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{padding:env(safe-area-inset-top) 0 calc(89px + env(safe-area-inset-bottom))}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.48;cursor:default}.app{width:min(650px,100%);margin:auto;padding:19px 18px}.header,.between{display:flex;justify-content:space-between;align-items:center}.header{margin-bottom:23px}.brand{display:flex;align-items:center;gap:11px}.brandmark{height:38px;width:38px;background:#173d32;border-radius:13px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;box-shadow:0 9px 16px rgba(19,123,92,.18)}.sub{font-size:12px;color:var(--muted)}.brandname{font-size:15px;font-weight:720;letter-spacing:-.4px}.iconbtn{height:40px;width:40px;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--ink);display:grid;place-items:center}.iconbtn svg,.nav svg,.action svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.surface{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.kicker{font-size:13px;color:var(--muted)}h1{font-weight:750;letter-spacing:-1.15px;line-height:1.12;margin:0;font-size:30px}h2{font-size:18px;letter-spacing:-.45px;margin:0;font-weight:730}.hero{padding:22px;margin-bottom:13px}.heroamount{font-size:37px;letter-spacing:-1.7px;font-weight:760;margin:9px 0 4px}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:30px;background:var(--green-light);color:var(--green);font-size:11px;font-weight:620}.mutebtn{border:0;background:var(--bg);color:var(--ink);padding:9px 10px;border-radius:11px;font-size:12px}.period{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px}.period .label{font-weight:600;font-size:13px}.cards2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.smallcard{padding:16px;min-height:102px}.smallcard .number{font-size:25px;font-weight:720;margin-top:13px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:21px 2px 13px}.sectiontitle button{border:0;background:transparent;color:var(--green);font-size:13px;font-weight:600}.catrow{padding:11px 1px}.catrow .between{font-size:13px}.catrow strong{font-weight:650}.barbg{height:6px;background:var(--line);border-radius:8px;margin-top:10px;overflow:hidden}.barfill{height:100%;background:var(--green);border-radius:8px}.listitem{display:flex;align-items:center;gap:12px;padding:14px 1px;border-bottom:1px solid var(--line);cursor:pointer}.listitem:last-child{border-bottom:0}.avatar{width:43px;height:43px;border-radius:13px;background:var(--bg);display:grid;place-items:center;font-size:21px;flex-shrink:0}.grow{flex:1;min-width:0}.itemname{font-size:14px;font-weight:670;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.line2{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.itemprice{font-size:14px;font-weight:680;white-space:nowrap}.dash{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}.button{background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:14px 18px;font-weight:670;font-size:14px}.button.positive{background:var(--green);color:#fff}.button.secondary{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.button.danger{color:#ba4558;background:transparent;border:1px solid #eebcc5}.button.full{width:100%}.buttonrow{display:flex;gap:9px}.buttonrow>*{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:9px max(10px,calc((100vw - 630px)/2)) calc(7px + env(safe-area-inset-bottom));display:flex;z-index:5;justify-content:space-around}.nav button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;min-width:66px;font-size:10px;font-weight:580}.nav button.active{color:var(--green)}.nav svg{width:22px;height:22px}.sheetback{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--panel);color:var(--ink);width:min(650px,100%);max-height:88vh;overflow-y:auto;border-radius:25px 25px 0 0;padding:21px 20px calc(25px + env(safe-area-inset-bottom))}.handle{height:4px;width:40px;background:var(--line);border-radius:10px;margin:-9px auto 20px}.input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:13px;margin:6px 0 12px;outline:none;font-size:15px}.formlabel{font-size:12px;color:var(--muted)}.itemedit{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:12px 0}.itemedit:last-child{border:0}.itemeditname{font-weight:610;font-size:13px;line-height:1.4}.itemeditsum{font-size:12px;color:var(--muted);margin-top:3px}.select{max-width:160px;min-width:125px;white-space:nowrap;text-overflow:ellipsis;padding:10px 7px;background:var(--bg);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:12px}.empty{padding:40px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}.fade{color:var(--muted);font-size:12px}.search{padding:13px 15px;border-radius:14px;background:var(--panel);border:1px solid var(--line);width:100%;color:var(--ink);margin:15px 0}.chiprow{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px}.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:40px;padding:9px 12px;white-space:nowrap;font-size:12px}.chip.on{background:var(--green-light);color:var(--green);border-color:transparent}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);padding:12px 17px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:13px;z-index:30;box-shadow:var(--shadow);width:max-content;max-width:90%;text-align:center}.chart{display:flex;align-items:end;gap:8px;height:165px;border-bottom:1px solid var(--line);padding:12px 4px 0}.chartbar{flex:1;background:var(--green-light);border-radius:7px 7px 0 0;min-height:2px;position:relative}.chartbar b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);font-weight:500}.chartbar.active{background:var(--green)}.skeleton{height:100px;border-radius:18px;background:var(--line);opacity:.65;animation:pulse 1.1s infinite alternate}@keyframes pulse{from{opacity:.4}to{opacity:.9}}.note{border-radius:14px;padding:13px;background:var(--green-light);font-size:12px;color:var(--green);line-height:1.5}.warn{background:#fff3df;color:#94621c}.launchmsg{padding:30px 20px;text-align:center}.footerhint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}.txtlink{border:0;background:transparent;color:var(--green);font-weight:650;padding:9px}.floatadd{position:fixed;bottom:90px;right:max(20px,calc((100vw - 630px)/2));z-index:5;border:0;background:var(--green);color:white;width:55px;height:55px;border-radius:18px;font-size:28px;box-shadow:0 8px 24px rgba(19,123,92,.26)}
</style></head><body><main class="app" id="app"><div class="header"><div class="brand"><div class="brandmark">₽</div><div><div class="brandname">Мои финансы</div><div class="sub">Telegram Mini App</div></div></div><button class="iconbtn" aria-label="Обновить" onclick="load()">↻</button></div><div class="skeleton"></div></main><nav class="nav" id="nav" hidden></nav><button class="floatadd" id="add" hidden onclick="openAdd()" aria-label="Добавить расход">+</button><div id="modal"></div><div id="toast"></div><script>

'use strict';
const TG=window.Telegram?.WebApp,AUTH=TG?.initData||'';
if(TG){TG.ready();TG.expand();try{TG.setHeaderColor('secondary_bg_color')}catch{}}
const iconPaths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/>',history:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6M12 7v5l3 2"/>',scan:'<path d="M5 3H3v5M19 3h2v5M3 16v5h5M21 16v5h-5M7 8h10M7 12h10M7 16h7"/>',chart:'<path d="M4 20h16M5 17V9M10 17V4M15 17v-6M20 17V7"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',edit:'<path d="M12 20h9M16 4l4 4-11 11-5 1 1-5 11-11z"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const ico=(n)=>`<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconPaths[n]||iconPaths.home}</svg>`;
const CATS={groceries:'Продукты',restaurants:'Кафе и рестораны',transport:'Транспорт',car:'Автомобиль',home:'Дом и ремонт',children:'Дети',health:'Здоровье',clothing:'Одежда и обувь',subscriptions:'Подписки',entertainment:'Развлечения',travel:'Путешествия',household:'Бытовые товары',gifts:'Подарки',communications:'Связь',education:'Обучение',other:'Прочее'};
const shareNames={mine:'Моё',shared2:'На двоих',shared3:'На троих',shared4:'На четверых',others:'Не моё'};
const PLACE_KIND_LABELS={marketplace:'Маркетплейсы',grocery_delivery:'Доставка продуктов',offline:'Офлайн-магазины',food:'Кафе и рестораны',service:'Услуги и платежи',unknown:'Не определено'};
const PLACE_FALLBACK={unknown:'Не определено',ozon:'Ozon',wildberries:'Wildberries',aliexpress:'AliExpress',yandex_market:'Яндекс Маркет',avito:'Авито',samokat:'Самокат',yandex_lavka:'Яндекс Лавка',ozon_fresh:'Ozon Fresh',offline_store:'Офлайн-магазины',cafe:'Кафе и рестораны',other_online:'Другие онлайн-магазины',services:'Услуги'};
function placeLabel(id){if(!id||id==='unknown')return 'Место не указано';return state.places.find(p=>p.id===id)?.name||PLACE_FALLBACK[id]||'Место не указано'}
function categoryLabel(id){return state.categories.find(c=>c.id===id)?.name||CATS[id]||'Прочее'}
function categoryOptions(){
 return (state.categories.length?state.categories:Object.entries(CATS).map(([id,name])=>({id,name})));
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(minor,c='RUB')=>{const n=(Number(minor)||0)/100;return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2,style:'currency',currency:c==='RUB'?'RUB':c}).format(n)};
const shortDate=v=>{try{return new Date(v+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}catch{return v}};
const safeMonth=()=>{const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit'}).formatToParts(new Date());return parts.find(p=>p.type==='year').value+'-'+parts.find(p=>p.type==='month').value};
const state={tab:'home',month:safeMonth(),loading:true,rows:[],drafts:[],textBatches:[],places:[],categories:[],rules:[],transfers:[],placeFocus:null,report:{currencies:[],categories:[],merchants:[],places:[],place_categories:[],transfers:[]},search:'',filter:'all',selected:null};
const el=id=>document.getElementById(id);const page=()=>el('app');
function toast(msg){el('toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>el('toast').innerHTML='',3500)};
async function api(path,body){if(!AUTH)throw Error('Открой приложение из Telegram');let res=await fetch(new URL('https://lcbazccnalzbvfvcxyoe.supabase.co/functions/v1/finance-app/api/'+path),{method:body?'POST':'GET',headers:{'x-telegram-init-data':AUTH,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});let v=await res.json().catch(()=>({error:'Некорректный ответ сервера'}));if(!res.ok)throw Error(v.error||'Ошибка соединения');return v}
const navData=[['home','home','Обзор'],['history','history','История'],['drafts','scan','Документы'],['analytics','chart','Аналитика']];
function nav(){el('nav').hidden=false;el('nav').innerHTML=navData.map(([id,ic,name])=>`<button class="${state.tab===id?'active':''}" onclick="tab('${id}')">${ico(ic)}<span>${name}</span></button>`).join('');el('add').hidden=state.tab==='drafts'}
function header(){return `<div class="header"><div class="brand"><div class="brandmark">₽</div><div><div class="brandname">Мои финансы</div><div class="sub">Учёт личных расходов</div></div></div><div style="display:flex;gap:6px"><button class="iconbtn" aria-label="Категории и правила" onclick="openCatalog()">⚙</button><button class="iconbtn" aria-label="Обновить" onclick="load()">↻</button></div></div>`}
function monthpicker(){return `<div class="period"><button class="mutebtn" onclick="changeMonth(-1)">‹</button><span class="label">${new Date(state.month+'-01T12:00:00').toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</span><button class="mutebtn" onclick="changeMonth(1)">›</button></div>`}
function catBar(name,amount,max){return `<div class="catrow"><div class="between"><span>${esc(name)}</span><strong>${fmt(amount)}</strong></div><div class="barbg"><div class="barfill" style="width:${Math.min(100,max?Math.round(100*amount/max):0)}%"></div></div></div>`}
const anyRUB=()=>state.report.currencies.find(c=>c.currency==='RUB');
function overview(){const total=Number(anyRUB()?.amount_minor||0),r=state.report.categories.filter(c=>c.currency==='RUB'),max=Math.max(...r.map(x=>Number(x.amount_minor)),1),drafts=state.drafts.length+state.textBatches.length;return `<section class="surface hero">${monthpicker()}<div class="kicker">Мои расходы</div><div class="heroamount">${fmt(total)}</div><div class="sub">${anyRUB()?.count||0} покупок за выбранный месяц</div>${state.report.currencies.filter(c=>c.currency!=='RUB').length?`<div class="footerhint">Другие валюты учитываются отдельно: ${state.report.currencies.filter(c=>c.currency!=='RUB').map(c=>fmt(c.amount_minor,c.currency)).join(', ')}</div>`:''}</section><div class="cards2"><div class="surface smallcard" onclick="tab('history')"><div class="kicker">Покупки</div><div class="number">${anyRUB()?.count||0}</div><div class="sub">История →</div></div><div class="surface smallcard" onclick="tab('drafts')"><div class="kicker">На проверке</div><div class="number">${drafts}</div><div class="sub">Разобрать →</div></div></div><div class="sectiontitle"><h2>Куда уходят деньги</h2><button onclick="tab('analytics')">Подробнее →</button></div>${r.length?r.slice(0,6).map(x=>catBar(x.category,Number(x.amount_minor),max)).join(''):'<div class="surface empty">За этот месяц расходов пока нет.<br>Отправь чек боту или добавь расход.</div>'}<div class="sectiontitle"><h2>Последние покупки</h2><button onclick="tab('history')">Вся история →</button></div><div class="surface" style="padding:0 14px">${listTx(state.rows.slice(0,5))}</div>`}
const shopIcon=x=>/ozon|wildberries|вайлдбер|wb|маркет/i.test(x)?'📦':/кафе|кофе|ресторан|бар/i.test(x)?'☕':'🧾';
function listTx(rows){return rows.length?rows.map(t=>`<div class="listitem" onclick="tx('${t.id}')"><div class="avatar">${shopIcon(t.merchant)}</div><div class="grow"><div class="itemname">${esc(t.merchant||'Покупка')}</div><div class="line2">${esc(shortDate(t.occurred_on))} · ${esc(placeLabel(t.place_id||'unknown'))}</div></div><div class="itemprice">${fmt(t.amount_minor,t.currency)}</div></div>`).join(''):'<div class="empty">Пока нет покупок</div>'}
function history(){let rows=state.rows.filter(t=>(state.filter==='all'||(state.filter==='manual'?t.source==='manual':t.source==='photo'))&&(!state.search||`${t.merchant} ${t.note}`.toLowerCase().includes(state.search.toLowerCase())));return `<h1>История</h1>${monthpicker()}<input class="search" placeholder="Поиск по покупкам..." value="${esc(state.search)}" oninput="state.search=this.value;el('txlist').innerHTML=listTx(state.rows.filter(t=>(state.filter==='all'||(state.filter==='manual'?t.source==='manual':t.source==='photo'))&&(!state.search||String(t.merchant+' '+t.note).toLowerCase().includes(state.search.toLowerCase()))))"><div class="chiprow"><button class="chip ${state.filter==='all'?'on':''}" onclick="setFilter('all')">Все</button><button class="chip ${state.filter==='photo'?'on':''}" onclick="setFilter('photo')">Чеки и заказы</button><button class="chip ${state.filter==='manual'?'on':''}" onclick="setFilter('manual')">Вручную</button></div><div class="surface" id="txlist" style="padding:0 15px">${listTx(rows)}</div><button class="txtlink" style="display:block;margin:24px auto;color:#bf5b65" onclick="clearHistory()">Очистить историю...</button><div class="footerhint">В истории показаны до 400 последних покупок выбранного месяца. Удалённые операции скрываются, но сохраняются в техническом архиве.</div>`}
function drafts(){
 const batches=state.textBatches||[];
 const photos=state.drafts||[];
 let view='<div class="between"><h1>Документы</h1><button class="txtlink" onclick="openCatalog()">⚙ Категории и места</button></div><div class="sub" style="margin:9px 0 20px">Бот уже разобрал покупки. Исправлять нужно только при необходимости.</div>';
 if(batches.length){
   view+='<div class="sectiontitle"><h2>Списки покупок</h2><span class="sub">'+batches.length+' на проверке</span></div><div class="surface" style="padding:0 15px">'+
   batches.map(b=>{
     const items=Array.isArray(b.payload?.items)?b.payload.items:[];
     const mine=items.filter(x=>(x.save_as??(x.include?'expense':'exclude'))==='expense');
     const total=mine.reduce((n,x)=>n+Number(x.amount_minor||0),0);
     const unclear=items.length-mine.length;
     return '<div class="listitem" onclick="openTextBatch(\''+b.id+'\')"><div class="avatar">🛍</div>'+
       '<div class="grow"><div class="itemname">'+mine.length+' покупок · '+esc(b.payload?.date||'Дата')+'</div>'+
       '<div class="line2">'+(unclear?unclear+' вне расходов · ':'')+'Категории и площадки</div></div>'+
       '<div class="itemprice">'+fmt(total)+'</div></div>';
   }).join('')+'</div>';
 }
 if(photos.length){
   view+='<div class="sectiontitle"><h2>Чеки и заказы</h2></div><div class="surface" style="padding:0 15px">'+
   photos.map(d=>{let p=d.payload||{};return '<div class="listitem" onclick="openDraft(\''+d.id+'\')"><div class="avatar">📑</div>'+
   '<div class="grow"><div class="itemname">'+esc(p.merchant||'Документ')+'</div><div class="line2">'+(p.items?.length||0)+
   ' позиций · '+esc(p.date||'Дата не распознана')+'</div></div><div class="itemprice">'+fmt(p.total_minor,p.currency||'RUB')+'</div></div>'}).join('')+'</div>';
 }
 if(!batches.length&&!photos.length)view+='<div class="surface empty">Нет покупок на проверке. Отправь чек, скриншот или список расходов в Telegram.</div>';
 return view+'<div class="note" style="margin-top:16px">Категории, площадки и типы операций можно изменить здесь. Сохранение — одним нажатием.</div>';
}
function openMissingPlaces(){
 const missing=(state.rows||[]).filter(t=>t.currency==='RUB'&&(!t.place_id||t.place_id==='unknown'));
 let out='<div class="between"><div><div class="kicker">Аналитика</div><h2>Место покупки</h2></div><button class="iconbtn" onclick="closeModal()">×</button></div>'+
 '<div class="note" style="margin:14px 0">Категории уже учтены. Если помнишь магазин или сервис, открой покупку и выбери его. Если нет — можно оставить как есть.</div>';
 out+=missing.length?'<div class="surface" style="padding:0 14px">'+missing.map(t=>
  '<div class="listitem"><div class="avatar">📍</div><div class="grow" style="min-width:0"><div class="itemname">'+esc(t.note||t.merchant||'Покупка')+'</div>'+
  '<div class="line2">'+esc(shortDate(t.occurred_on))+' · '+fmt(t.amount_minor,t.currency)+'</div></div>'+
  '<button class="txtlink" data-id="'+esc(t.id)+'" onclick="tx(this.dataset.id)">Изменить</button></div>'
 ).join('')+'</div>':'<div class="surface empty">За этот месяц таких покупок нет.</div>';
 out+='<div class="footerhint">В карточке покупки можно также создать новое место.</div>';
 sheet(out);
}
function placeAnalytics(){
 const all=(state.report.places||[]).filter(x=>x.currency==='RUB');
 const kinds=['marketplace','grocery_delivery','offline','food','service'];
 const missing=all.find(x=>x.place_id==='unknown');
 let body='<div class="sectiontitle"><h2>Где совершены покупки</h2></div>';
 if(!all.length)body+='<div class="surface empty">Покупок за этот месяц пока нет</div>';
 for(const kind of kinds){
   const items=all.filter(x=>x.kind===kind&&x.place_id!=='unknown');
   if(!items.length)continue;
   body+='<div class="footerhint" style="margin-top:14px;margin-bottom:6px">'+PLACE_KIND_LABELS[kind]+'</div>';

async function openTextBatch(id,expanded=-1){
 try{
  const response=await api('text-batch?id='+encodeURIComponent(id));
  const batch=response.batch,p=batch.payload||{},items=Array.isArray(p.items)?p.items:[];
  if(batch.status!=='ready'){toast('Список уже обработан');return}
  state.selected={type:'text-batch',id};
  const groups=new Map(),separate=[];
  items.forEach((item,index)=>{
    if(batchMode(item)!=='expense'){separate.push({item,index});return}
    const cat=item.category||'other';
    if(!groups.has(cat))groups.set(cat,[]);
    groups.get(cat).push({item,index});
  });
  const purchases=items.filter(x=>batchMode(x)==='expense'),transfers=items.filter(x=>['external','own'].includes(batchMode(x)));
  const total=purchases.reduce((n,x)=>n+Number(x.amount_minor||0),0);
  let html='<div class="between"><div><div class="kicker">Список покупок · '+esc(p.date||'')+'</div>'+
    '<h2 style="margin:5px 0">Проверка расходов</h2></div><button class="iconbtn" onclick="closeModal()">'+ico('close')+'</button></div>'+
    '<div class="surface smallcard" style="margin:14px 0"><div class="kicker">К сохранению</div>'+
    '<div class="number" style="font-size:25px;margin:4px 0">'+fmt(total)+'</div>'+
    '<div class="sub">'+purchases.length+' покупок · '+transfers.length+' переводов · '+(items.length-purchases.length-transfers.length)+' исключено</div></div>'+
    '<div class="note">Бот предложил категории автоматически. Нажми на товар, только если хочешь что-то исправить.</div>'+  '<button class="txtlink" style="margin-top:9px" onclick="openCatalog()">＋ Добавить категорию или место</button>';
  for(const [category,entries] of groups)html+=batchEditorGroup(id,category,entries,expanded);
  if(separate.length)html+=batchEditorGroup(id,'__separate__',separate,expanded);
  html+='<div style="display:grid;gap:10px;margin-top:20px">'+
    '<button class="button positive full" onclick="confirmTextBatch(\''+id+'\')" '+(purchases.length+transfers.length?'':'disabled')+'>Подтвердить операции</button>'+
    '<button class="button full" onclick="cancelTextBatch(\''+id+'\')">Отменить список</button></div>';
  sheet(html);
 }catch(e){toast(e.message)}
}
async function changeBatchField(id,index,field,value){

   newCatalog(field,{source:'batch',kind:field,id,index});return;
 }
 try{
  const v=await api('batch-edit',{id,index,field,value});
  if(v.status!=='ok')throw Error('Не удалось изменить: '+String(v.status));
  await openTextBatch(id,index);toast('Изменение сохранено');
 }catch(e){toast(e.message)}
}

 if(!title||title.length<2||title.length>160||!Number.isFinite(amount)||amount<=0||
    !Number.isSafeInteger(amount_minor)||Math.abs(amount_minor/100-amount)>.005){
  toast('Проверь название и сумму');return;

 try{
  const v=await api('batch-edit',{id,index,field:'details',title,amount_minor});

async function reopenPurchaseContext(ctx){
 if(ctx.source==='batch')return openTextBatch(ctx.id,ctx.index);
 if(ctx.source==='draft')return openDraft(ctx.id);

async function saveCatalog(kind){
 const name=el('ct-name')?.value.trim(),phrase=el('ct-phrase')?.value.trim();
 if(!name||name.length<2){toast('Укажи название');return}
 const context=state.catalogContext;
 try{
  const created=await api('catalog-create',{kind,name,place_kind:el('ct-kind')?.value||'offline'});
  if(created.status!=='ok'||!created.record?.id)throw Error('Создать не удалось');
  let ruleWarning='';
  if(phrase){
   try{await api('rule-create',{target_type:kind,target_id:created.record.id,phrase,
    match_field:el('ct-field')?.value,match_type:el('ct-match')?.value})}
   catch(e){ruleWarning=e.message}
  }
  let applyWarning='';
  if(context){
   try{
    let applied;
    if(context.source==='batch'){
     applied=await api('batch-edit',{id:context.id,index:context.index,
      field:kind==='category'?'category':'place',value:created.record.id});
    }else if(kind==='category'){
     applied=await api('category',{kind:context.source,id:context.id,
      index:context.index,category:created.record.id});
    }else{
     applied=await api('place',{kind:context.source,id:context.id,
      place:created.record.id});
    }
    if(applied.status!=='ok')throw Error('Не удалось присвоить новой записи');
   }catch(e){applyWarning=e.message}
  }
  await refreshSilent();
  state.catalogContext=null;
  if(context&&!applyWarning)await reopenPurchaseContext(context);
  else openCatalog();
  if(applyWarning)toast('Категория создана, но покупку не удалось изменить: '+applyWarning);
  else if(ruleWarning)toast('Добавлено; правило не сохранилось: '+ruleWarning);
  else toast(context?'Создано и выбрано для покупки':'Добавлено'+(phrase?' с правилом':''));
 }catch(e){toast(e.message)}
}

 '<option value="item" '+(cats?'selected':'')+'>Название товара / описание</option>'+
 '<option value="merchant" '+(!cats?'selected':'')+'>Название магазина</option></select>'+
 '<label class="formlabel">Фраза</label><input class="input" id="rl-phrase" maxlength="90" placeholder="подгузники"/>'+
 '<label class="formlabel">Совпадение</label><select class="input" id="rl-match"><option value="contains">Содержит</option><option value="exact">Совпадает полностью</option></select>'+
 '<button class="button positive full" style="margin-top:17px" data-kind="'+kind+'" onclick="saveCatalogRule(this.dataset.kind)">Создать правило</button>'+
 '<button class="button full" style="margin-top:8px" onclick="openCatalog()">Назад</button>');
}
async function saveCatalogRule(type){
 try{
  await api('rule-create',{target_type:type,target_id:el('rl-target')?.value,match_field:el('rl-field')?.value,
  match_type:el('rl-match')?.value,phrase:el('rl-phrase')?.value});
  await refreshSilent();openCatalog();toast('Правило действует для будущих покупок');
 }catch(e){toast(e.message)}
}
async function toggleCatalogRule(id,enabled){
 try{await api('rule-toggle',{id,enabled});await refreshSilent();openCatalog();toast('Статус правила обновлён')}catch(e){toast(e.message)}
}
async function deleteCatalogRule(id){
 if(!confirm('Удалить правило?'))return;
 try{await api('rule-delete',{id});await refreshSilent();openCatalog();toast('Правило удалено')}catch(e){toast(e.message)}
}

function selectPlace(value,id,kind){
 const options=state.places.length?state.places:Object.entries(PLACE_FALLBACK).map(([id,name])=>({id,name}));
 const ctx="{source:'"+kind+"',kind:'place',id:'"+id+"'}";
 return '<div style="display:grid;gap:7px">'+
  '<select class="select" aria-label="Место покупки" onchange="if(this.value===\'__new__\')newCatalog(\'place\','+ctx+');else updatePlace(\''+kind+'\',\''+id+'\',this.value)">'+
  options.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===value?'selected':'')+'>'+esc(p.id==='unknown'?'Не указано':p.name)+'</option>').join('')+
  '<option value="__new__">＋ Создать новое место…</option></select>'+
  '<button class="txtlink" style="justify-self:start;padding:7px 0" onclick="newCatalog(\'place\','+ctx+')">＋ Добавить своё место покупки</button></div>';
}
function selectCategory(value,id,kind,idx,parentId=''){
 const ctx="{source:'"+kind+"',kind:'category',id:'"+id+"',index:"+idx+",parent:'"+parentId+"'}";
 return '<div style="display:grid;gap:7px;min-width:150px">'+
  '<select class="select" aria-label="Категория покупки" onchange="if(this.value===\'__new__\')newCatalog(\'category\','+ctx+');else updateCategory(\''+kind+'\',\''+id+'\','+idx+',this.value)">'+
  categoryOptions().map(c=>'<option value="'+esc(c.id)+'" '+(c.id===value?'selected':'')+'>'+esc(c.name)+'</option>').join('')+
  '<option value="__new__">＋ Создать категорию…</option></select>'+
  '<button class="txtlink" style="justify-self:start;padding:7px 0" onclick="newCatalog(\'category\','+ctx+')">＋ Своя категория</button></div>';
}
async function tx(id){try{const v=await api('transaction?id='+encodeURIComponent(id));let t=v.transaction,items=v.items||[];state.selected={type:'tx',id};sheet(`<div class="between"><div><div class="kicker">${esc(t.occurred_on)}</div><h2 style="margin:5px 0">${esc(t.merchant||'Покупка')}</h2></div><button class="iconbtn" onclick="closeModal()">${ico('close')}</button></div><h1 style="margin:17px 0 2px">${fmt(t.amount_minor,t.currency)}</h1><div class="sub">${t.gross_amount_minor&&t.gross_amount_minor!==t.amount_minor?'Полный счёт '+fmt(t.gross_amount_minor,t.currency):'Личные расходы'}</div><div class="sectiontitle"><h2>Где куплено</h2></div>${selectPlace(t.place_id||'unknown',id,'saved')}<div class="sectiontitle"><h2>Позиции · ${items.length}</h2></div>${items.map((x,i)=>`<div class="itemedit"><div class="grow"><div class="itemeditname">${esc(x.title)}</div><div class="itemeditsum">${fmt(x.amount_minor,t.currency)}</div></div>${selectCategory(x.category_id,x.id,'saved',i,id)}</div>`).join('')||'<div class="empty">Нет товарных позиций</div>'}<div class="buttonrow" style="margin-top:24px"><button class="button secondary" onclick="closeModal()">Закрыть</button><button class="button danger" onclick="deleteTx('${id}')">Удалить</button></div>`)}catch(e){toast(e.message)}}
async function openDraft(id){try{const v=await api('draft?id='+encodeURIComponent(id));let d=v.draft,p=d.payload||{},items=p.items||[];state.selected={type:'draft',id};const total=items.reduce((s,x)=>s+(Number(x.amount_minor)||0),0),mine=items.reduce((s,x)=>s+(Number(x.my_minor??x.amount_minor)||0),0);const payment=p.source==='marketplace_order'&&p.payment_status!=='paid';sheet(`<div class="between"><div><div class="kicker">Черновик · ${esc(p.date)}</div><h2 style="margin:5px 0">${esc(p.merchant||'Документ')}</h2></div><button class="iconbtn" onclick="closeModal()">${ico('close')}</button></div><div class="cards2" style="margin:16px 0"><div class="surface smallcard"><div class="kicker">Весь счёт</div><div class="number" style="font-size:21px">${fmt(p.total_minor,p.currency)}</div></div><div class="surface smallcard"><div class="kicker">Моя доля</div><div class="number" style="font-size:21px">${fmt(mine,p.currency)}</div></div></div>${total!==Number(p.total_minor)?'<div class="note warn">Суммы товаров не сходятся с итогом — подтверждение недоступно. Нужно исправить распознавание.</div>':''}${payment?'<div class="note warn" style="margin-bottom:12px">Оплата заказа ещё не подтверждена.</div><button class="button secondary full" onclick="markPaid(\''+id+'\')">Я проверил: заказ оплачен</button>':''}<div class="sectiontitle"><h2>Где куплено</h2></div>${selectPlace(p.place_id||'unknown',id,'draft')}<div class="sectiontitle"><h2>Товарные позиции · ${items.length}</h2></div>${items.map((x,i)=>`<div class="itemedit"><div class="grow"><div class="itemeditname">${esc(x.name)}</div><div class="itemeditsum">${fmt(x.amount_minor,p.currency)} · моё ${fmt(x.my_minor??x.amount_minor,p.currency)}</div><div style="margin-top:7px"><select class="select" onchange="updateShare('${id}',${i},this.value)">${Object.entries(shareNames).map(([k,n])=>`<option value="${k}" ${(x.split_mode||'mine')===k?'selected':''}>${n}</option>`).join('')}</select></div></div>${selectCategory(x.category,id,'draft',i)}</div>`).join('')||'<div class="empty">Нет товаров</div>'}${(p.warnings||[]).length?`<div class="note warn" style="margin:13px 0">${p.warnings.map(esc).join('<br>')}</div>`:''}<div class="buttonrow" style="margin-top:24px"><button class="button secondary" onclick="cancelDraft('${id}')">Отменить</button><button class="button positive" ${total!==Number(p.total_minor)||!mine||payment?'disabled':''} onclick="confirmDraft('${id}')">Подтвердить</button></div><div class="footerhint">Категории и доли сохраняются сразу; окончательно расход учитывается после подтверждения.</div>`)}catch(e){toast(e.message)}}
async function updatePlace(kind,id,place){
 try{
  const result=await api('place',{kind,id,place});
  if(result.status!=='ok')throw Error('Место покупки не изменено');
  toast('Место покупки обновлено');
  if(kind==='draft')await openDraft(id);else await tx(id);
  await refreshSilent();
 }catch(e){toast(e.message)}
}
async function updateCategory(kind,id,idx,category){try{await api('category',{kind,id,index:idx,category});toast('Категория обновлена');if(kind==='draft')await openDraft(id);else if(state.selected?.type==='tx')await tx(state.selected.id);await refreshSilent()}catch(e){toast(e.message)}}
async function updateShare(id,index,mode){try{await api('share',{id,index,mode});toast('Доля изменена');await openDraft(id)}catch(e){toast(e.message)}}
async function markPaid(id){if(!confirm('Подтверждаешь, что заказ действительно оплачен?'))return;try{const result=await api('paid',{id});if(result.status!=='ok')throw Error('Статус оплаты не изменён');await openDraft(id)}catch(e){toast(e.message)}}
async function confirmDraft(id){try{const result=await api('confirm',{id});if(result.status!=='ok'&&result.status!=='duplicate')throw Error('Документ не подтверждён: '+String(result.status));closeModal();state.tab='history';await load();toast('Покупка сохранена')}catch(e){toast(e.message)}}
async function cancelDraft(id){if(!confirm('Отменить этот черновик?'))return;try{await api('cancel',{id});closeModal();await load();toast('Черновик отменён')}catch(e){toast(e.message)}}
async function deleteTransfer(id){
 if(!confirm('Удалить этот перевод из истории и статистики?'))return;
 try{
  const result=await api('transfer-delete',{id});
  if(result.status!=='ok')throw Error('Перевод не найден');
  await load();toast('Перевод удалён');
 }catch(e){toast(e.message)}
}
async function deleteTx(id){if(!confirm('Удалить эту покупку из истории и аналитики?'))return;try{let x=await api('delete-start',{action:'one',id});let y=await api('delete-confirm',{intentId:x.id});if(y.status!=='ok')throw Error('Не удалось удалить запись');closeModal();await load();toast('Покупка удалена')}catch(e){toast(e.message)}}
async function clearHistory(){if(!confirm('Очистить всю историю расходов? Все ранее сохранённые покупки будут скрыты из статистики.'))return;if(prompt('Для подтверждения введи ОЧИСТИТЬ')!=='ОЧИСТИТЬ')return;try{const x=await api('delete-start',{action:'all'}),y=await api('delete-confirm',{intentId:x.id});if(y.status!=='ok')throw Error('Очистка не выполнена');await load();toast('История очищена')}catch(e){toast(e.message)}}

function suggestManual(){
 const desc=String(el('newdesc')?.value||'').normalize('NFKC').toLocaleLowerCase('ru-RU').replace(/\s+/g,' ').trim();
 if(!desc)return;
 const sorted=[...(state.rules||[])].filter(x=>x.enabled).sort((a,b)=>
  (b.match_type==='exact'?1:0)-(a.match_type==='exact'?1:0)||b.phrase.length-a.phrase.length);
 for(const type of ['category','place']){
  const select=el(type==='category'?'newcat':'newplace');
  if(!select||select.dataset.touched==='1')continue;
  const matched=sorted.find(rule=>{
   if(rule.target_type!==type)return false;
   const phrase=String(rule.phrase).normalize('NFKC').toLocaleLowerCase('ru-RU').replace(/\s+/g,' ').trim();
   return phrase&&(rule.match_type==='exact'?desc===phrase:desc.includes(phrase));
  });
  if(matched)select.value=matched.target_id;
 }
}

function openAdd(){sheet(`<div class="between"><h2>Новый расход</h2><button class="iconbtn" onclick="closeModal()">${ico('close')}</button></div><div style="margin-top:22px"><label class="formlabel">Сумма в рублях</label><input class="input" id="newamount" inputmode="decimal" placeholder="Например, 350,50"/><label class="formlabel">Описание</label><input class="input" id="newdesc" oninput="suggestManual()" placeholder="Кофе, такси, продукты..."/><label class="formlabel">Категория</label><select class="input" id="newcat" onchange="this.dataset.touched='1'">${categoryOptions().map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select><label class="formlabel">Где куплено</label><select class="input" id="newplace" onchange="this.dataset.touched='1'"><option value="auto">Определить автоматически</option>${(state.places||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><button class="button positive full" onclick="saveManual()">Сохранить расход</button><div class="footerhint">Если задано правило для описания, категория и магазин подставятся автоматически. Фото чека отправляй в чат с ботом.</div></div>`)}
async function saveManual(){let amount=el('newamount')?.value.replace(',','.'),desc=el('newdesc')?.value.trim(),category=el('newcat')?.value;if(!Number.isFinite(+amount)||+amount<=0||!desc){toast('Укажи корректную сумму и описание');return}try{await api('manual',{amount:+amount,description:desc,category,place:el('newplace')?.value||'auto'});closeModal();state.tab='history';await load();toast('Расход добавлен')}catch(e){toast(e.message)}}
async function refreshSilent(){let d=await api('state?month='+encodeURIComponent(state.month));state.rows=d.transactions||[];state.drafts=d.drafts||[];state.textBatches=d.batches||[];state.places=d.places||[];state.categories=d.categories||[];state.rules=d.rules||[];state.transfers=d.transfers||[];state.report=d.report||{currencies:[],categories:[],merchants:[]};render()}
load();

</script></body></html>
